<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce_ATC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <p class="eyebrow">Curated essentials</p>
        <h1>Fresh finds for you.</h1>
        <p class="intro">Pick something you love and we'll keep track of the rest.</p>
      </header>

      <main class="shop-grid">
        <section class="products-panel" aria-labelledby="products-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Shop</p>
              <h2 id="products-heading">Popular picks</h2>
            </div>
            <span class="item-count">3 items</span>
          </div>
          <div id="products-list"></div>
        </section>

        <aside class="cart-panel" aria-labelledby="cart-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Your bag</p>
              <h2 id="cart-heading">Shopping cart</h2>
            </div>
            <span class="cart-icon" aria-hidden="true">Bag</span>
          </div>
          <div id="cart-items-Display" aria-live="polite">
            <p id="empty-cart">Your cart is empty.<span>Add a product to see it here.</span></p>
          </div>

          <div id="cart-total" class="hidden">
            <p class="total-row"><span>Total</span><strong id="total-price">$0.00</strong></p>
            <button id="checkout-btn">Checkout <span aria-hidden="true">&rarr;</span></button>
          </div>
        </aside>
      </main>
      </div>

    <script src="script.js"></script>
  </body>
</html>
